<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пісочниця блок-схем</title>
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="../core/core.css?v=82">
<link rel="stylesheet" href="../spysky/game.css?v=82">
<link rel="stylesheet" href="../core/flow.css?v=82">
</head>
<body class="is-play">
<div class="sheet fsb-sheet" id="app">
  <div class="topnav"><a class="link" href="./">← Блок-схеми</a></div>
  <div class="eyebrow">Основи програмування · вільна творчість</div>
  <h1>Пісочниця блок-схем</h1>
  <p>Склади власну блок-схему: клацни на блок, а потім обери, що додати після нього. Стрілки й гілки малюються самі. Схема зберігається в цьому браузері автоматично.</p>
  <div class="fsb-bar">
    <input class="answer-input fsb-title" id="title" maxlength="60" placeholder="Назва схеми" autocomplete="off">
    <label class="fsb-ex">Приклад: <select id="ex"><option value="">— обери —</option></select></label>
    <button class="btn ghost" id="undo" title="Скасувати останню зміну (Ctrl+Z)">↶ Назад</button>
    <button class="btn ghost" id="fresh">Нова схема</button>
  </div>
  <div class="fsb-work">
    <div class="fsb-canvas" id="canvas"></div>
    <div class="fsb-panel" id="panel"></div>
  </div>
  <div class="arow sbsave">
    <button class="btn" id="save">💾 Зберегти в акаунт</button>
    <button class="btn ghost" id="open">📂 Відкрити збережене</button>
    <button class="btn ghost" id="png">🖼 Завантажити картинку</button>
    <span class="muted" id="st"></span>
  </div>
</div>
<script src="../core/core.js?v=82"></script>
<script src="../core/flow.js?v=82"></script>
<script src="sandbox.js?v=82"></script>
</body>
</html>
