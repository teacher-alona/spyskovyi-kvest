<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Піксельна малювалка</title>
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="../core/core.css?v=90">
<link rel="stylesheet" href="../spysky/game.css?v=90">
<link rel="stylesheet" href="pix.css?v=90">
</head>
<body class="is-play">
<div class="sheet px-sheet" id="app">
  <div class="topnav"><a class="link" href="../#art">← Цифрове мистецтво</a></div>
  <div class="eyebrow">Цифрове мистецтво · вільна творчість</div>
  <h1>Піксельна малювалка</h1>
  <p>Обери розмір полотна й малюй піксель за пікселем. Малюнок зберігається в цьому браузері автоматично.</p>

  <div class="px-bar">
    <label>Полотно:
      <select id="size">
        <option value="8x8">8 × 8</option>
        <option value="16x16" selected>16 × 16</option>
        <option value="24x24">24 × 24</option>
        <option value="32x32">32 × 32</option>
        <option value="48x48">48 × 48</option>
        <option value="64x64">64 × 64</option>
        <option value="32x16">32 × 16 (широке)</option>
        <option value="16x32">16 × 32 (високе)</option>
        <option value="custom">Свій розмір…</option>
      </select>
    </label>
    <span class="px-custom" id="custom" hidden>
      <input type="number" id="cw" min="2" max="64" value="20" aria-label="Ширина"> × <input type="number" id="ch" min="2" max="64" value="20" aria-label="Висота">
      <button class="btn ghost" id="cok">Створити</button>
    </span>
    <span class="px-gap"></span>
    <button class="btn ghost" id="undo" title="Назад (Ctrl+Z)">↶</button>
    <button class="btn ghost" id="redo" title="Вперед (Ctrl+Y)">↷</button>
    <button class="btn ghost" id="clear">Очистити</button>
  </div>

  <div class="px-work">
    <div class="px-tools" id="tools"></div>
    <div class="px-stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="px-side">
      <div class="px-cur"><span class="px-sw big" id="cur"></span><input type="color" id="picker" value="#e53935" title="Свій колір"><span class="muted">свій колір</span></div>
      <div class="px-pal" id="pal"></div>
      <div class="px-h">Останні кольори</div>
      <div class="px-pal" id="recent"></div>
      <label class="px-chk"><input type="checkbox" id="grid" checked> Сітка</label>
      <label class="px-chk"><input type="checkbox" id="mirror"> Дзеркало (ліва ↔ права)</label>
      <div class="px-prev"><div class="px-h">Справжній розмір</div><canvas id="mini"></canvas></div>
    </div>
  </div>

  <div class="arow sbsave">
    <button class="btn" id="save">💾 Зберегти в акаунт</button>
    <button class="btn ghost" id="open">📂 Відкрити збережене</button>
    <label class="px-exp">Картинка: <select id="scale"><option value="1">×1</option><option value="8">×8</option><option value="16" selected>×16</option><option value="32">×32</option></select></label>
    <button class="btn ghost" id="png">🖼 Завантажити PNG</button>
    <span class="muted" id="st"></span>
  </div>
</div>
<script src="../core/core.js?v=90"></script>
<script src="pix.js?v=90"></script>
</body>
</html>
