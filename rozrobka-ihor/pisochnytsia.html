<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пісочниця ігор</title>
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="../core/core.css?v=64">
<link rel="stylesheet" href="../spysky/game.css?v=64">
<link rel="stylesheet" href="../core/arcade.css?v=64">
</head>
<body class="is-play">
<div class="sheet" id="app">
  <div class="topnav"><a class="link" href="./">← До Майстерні ігор</a></div>
  <div class="eyebrow">Розробка ігор · вільна творчість</div>
  <h1>Пісочниця</h1>
  <p>Тут немає зірок і помилок — просто твори. Усе зберігається в цьому браузері автоматично.</p>
  <div class="ltabs sbtabs"><button class="ltab on" data-tab="adv">🐍 Пригодницька гра</button><button class="ltab" data-tab="run">🟩 Стрибалка</button></div>
  <section id="adv" class="card sbcard">
    <div class="amake">
      <div class="aleft">
        <div id="editbox">
          <h3>Твоя сцена</h3>
          <div class="apal" id="tiles"></div>
          <div class="aplay"><div class="astage aedit" id="scene"></div></div>
          <div class="arow"><button class="btn" id="toplay">▶ Пограти</button><button class="btn ghost" id="clr">Очистити</button></div>
          <p class="muted">Обери предмет і клацай по клітинках. Гравець може бути лише один.</p>
        </div>
        <div id="playbox" hidden><div class="arow"><button class="btn ghost" id="toedit">✎ Редагувати сцену</button></div><div id="aplay"></div></div>
      </div>
      <div class="aright"><h3>Правила гри</h3><div id="arules"></div></div>
    </div>
  </section>
  <section id="run" class="card sbcard" hidden>
    <h2>Твій рівень</h2>
    <div class="arow"><label>Довжина: <input type="range" id="rlen" min="20" max="120" step="5"></label><b id="rlenv"></b><button class="btn ghost" id="rclr">Очистити</button><button class="btn" id="rck">Чи можна пройти?</button><span id="rres" class="muted"></span></div>
    <div id="redit"></div>
    <div id="rplay"></div>
  </section>
</div>
<script src="../core/core.js?v=64"></script>
<script src="../core/arcade.js?v=64"></script>
<script src="../core/runner.js?v=64"></script>
<script src="sandbox.js?v=64"></script>
</body>
</html>
