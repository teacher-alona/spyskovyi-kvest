<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Списковий квест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Шкільний зошит у клітинку: синя ручка, червоні поля й червона ручка вчителя. Одна колонка, список рівнів як клітинки Python-списку. */
:root {
  --paper: #f5f7fc;
  --grid: rgba(54, 86, 170, 0.09);
  --card: #ffffff;
  --line: #d7deec;
  --fg: #1a2133;
  --muted: #5a6479;
  --ink: #2346a8;
  --ink-soft: #e6ecfa;
  --red: #cf3434;
  --red-soft: #fbe7e5;
  --green: #1d7f53;
  --green-soft: #e1f3ea;
  --gold: #d99a0b;
  --code-bg: #eef2fa;
  --kw: #6c35a8;
  --str: #1d7a4b;
  --num: #b4520c;
  --com: #7c8597;
  --fn: #2346a8;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141e; --grid: rgba(140, 170, 255, 0.06); --card: #161d2a; --line: #283245;
    --fg: #e5e9f2; --muted: #9aa3b7; --ink: #8eaeff; --ink-soft: #1d2840;
    --red: #ff7b78; --red-soft: #3a1f24; --green: #5fd39b; --green-soft: #15302a; --gold: #f2bd45;
    --code-bg: #0b1018; --kw: #c49bff; --str: #7fd8a8; --num: #ffb27a; --com: #7d879c; --fn: #8eaeff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141e; --grid: rgba(140, 170, 255, 0.06); --card: #161d2a; --line: #283245;
  --fg: #e5e9f2; --muted: #9aa3b7; --ink: #8eaeff; --ink-soft: #1d2840;
  --red: #ff7b78; --red-soft: #3a1f24; --green: #5fd39b; --green-soft: #15302a; --gold: #f2bd45;
  --code-bg: #0b1018; --kw: #c49bff; --str: #7fd8a8; --num: #ffb27a; --com: #7d879c; --fn: #8eaeff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100%;
}
.sheet {
  max-width: 780px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
}
@media (min-width: 900px) {
  .sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: -28px; border-left: 2px solid var(--red); opacity: .45; }
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
code, pre, .mono { font-family: var(--f-code); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
:not(pre) > code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 .3em; font-size: .88em; white-space: nowrap; }

/* ---------- кнопки ---------- */
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--card); border-radius: 10px; padding: .6em 1.2em; font-weight: 800; transition: transform .08s; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { padding: .35em .8em; font-size: .9em; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: .2em 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- карта ---------- */
.hero { display: grid; gap: 10px; margin-bottom: 28px; }
.eyebrow { font-family: var(--f-code); font-size: .82rem; color: var(--muted); letter-spacing: .02em; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.05; font-weight: 700; color: var(--ink); }
.hero p { max-width: 58ch; color: var(--muted); }
.score { font-family: var(--f-code); font-size: .95rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .5em .8em; width: fit-content; }
.score b { color: var(--gold); }
.listopen, .listclose { font-family: var(--f-code); font-size: 1.15rem; color: var(--ink); font-weight: 600; }
.listopen { margin-bottom: 10px; }
.listclose { margin-top: 10px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 12px; padding-left: 14px; }
.cell { position: relative; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 30px 12px 12px; display: grid; gap: 6px; min-height: 124px; min-width: 0; align-content: start; }
.cell:not([disabled]):hover { border-color: var(--ink); }
.cell .idx { position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-family: var(--f-code); font-size: .75rem; color: var(--muted); }
.cell .kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.cell.learn .kind { color: var(--ink); }
.cell.boss .kind { color: var(--red); }
.cell h3 { overflow-wrap: anywhere; font-size: 1.02rem; line-height: 1.25; font-weight: 500; }
.cell .stars { font-size: 1.15rem; letter-spacing: 2px; color: var(--line); }
.cell .stars .on { color: var(--gold); }
.cell[disabled] { cursor: not-allowed; opacity: .55; }
.cell .lock { font-size: .85rem; color: var(--muted); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font-size: .9rem; }

/* ---------- рівень ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; display: grid; gap: 8px; margin-bottom: 14px; }
.topbar .row { justify-content: space-between; }
.hearts { font-size: 1.25rem; letter-spacing: 2px; color: var(--red); }
.hearts .off { color: var(--line); }
.progress { height: 8px; background: var(--ink-soft); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ink); border-radius: 99px; transition: width .3s; }
.lvtitle { font-family: var(--f-display); font-size: .95rem; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; padding: .2em .65em; border-radius: 99px; background: var(--ink-soft); color: var(--ink); }
.chip.warm { background: var(--green-soft); color: var(--green); }
.chip.new { background: var(--red-soft); color: var(--red); }
.q { font-size: 1.1rem; font-weight: 700; }
.lesson h2 { font-size: 1.3rem; font-weight: 500; color: var(--ink); }
.lesson p { max-width: 62ch; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; overflow-x: auto; font-size: .92rem; line-height: 1.6; }
.tok-kw { color: var(--kw); font-weight: 600; }
.tok-str { color: var(--str); }
.tok-num { color: var(--num); }
.tok-com { color: var(--com); font-style: italic; }
.tok-fn { color: var(--fn); }
.options { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: .7em 1em; font-weight: 600; }
.opt:not([disabled]):hover { border-color: var(--ink); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt[disabled] { cursor: default; }
textarea, input[type=text] { width: 100%; font-family: var(--f-code); font-size: .95rem; background: var(--code-bg); color: var(--fg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; line-height: 1.6; }
.answer-label { font-weight: 700; font-size: .92rem; color: var(--muted); }
.buglines { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; overflow-x: auto; display: grid; }
.bugline { display: flex; gap: 12px; align-items: baseline; text-align: left; border: 2px solid transparent; background: none; border-radius: 7px; padding: 4px 8px; font-family: var(--f-code); font-size: .92rem; white-space: pre; }
.bugline:not([disabled]):hover { border-color: var(--ink); }
.bugline .ln { color: var(--muted); min-width: 1.4em; text-align: right; user-select: none; }
.bugline.right { border-color: var(--green); background: var(--green-soft); }
.bugline.wrong { border-color: var(--red); background: var(--red-soft); }
.bugline[disabled] { cursor: default; }
.zone { display: grid; gap: 6px; min-height: 52px; background: var(--code-bg); border: 2px dashed var(--line); border-radius: 10px; padding: 8px; overflow-x: auto; }
.zone.target { border-style: solid; border-color: var(--ink-soft); }
.zone .empty { color: var(--muted); font-size: .9rem; padding: 6px; }
.piece { text-align: left; font-family: var(--f-code); font-size: .9rem; white-space: pre; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
.piece:hover { border-color: var(--ink); }
.fillcode input { width: auto; display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: .92rem; min-width: 3ch; }
.fillcode input.right { border-color: var(--green); }
.fillcode input.wrong { border-color: var(--red); }
.editor { min-height: 190px; tab-size: 4; white-space: pre; overflow-x: auto; }
.tests { display: grid; gap: 8px; }
.test { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .9rem; display: grid; gap: 4px; background: var(--card); }
.test.ok { border-color: var(--green); }
.test.fail { border-color: var(--red); }
.test .head { font-weight: 800; }
.test.ok .head { color: var(--green); }
.test.fail .head { color: var(--red); }
.test pre { margin: 0; font-family: var(--f-code); white-space: pre-wrap; word-break: break-word; font-size: .85rem; }
.hint { background: var(--ink-soft); border-radius: 10px; padding: 10px 14px; }
.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.good { background: var(--green-soft); }
.feedback.bad { background: var(--red-soft); }
.feedback .verdict { font-family: var(--f-hand); font-size: 1.85rem; line-height: 1; font-weight: 700; }
.feedback.good .verdict { color: var(--green); }
.feedback.bad .verdict { color: var(--red); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.actions .spacer { flex: 1; }
.status { font-size: .88rem; color: var(--muted); }

/* ---------- екрани ---------- */
.center { display: grid; gap: 18px; justify-items: start; }
.bigstars { font-size: 3rem; letter-spacing: 6px; color: var(--line); line-height: 1; }
.bigstars .on { color: var(--gold); }
.intro h2 { font-size: clamp(1.5rem, 5vw, 2.1rem); color: var(--ink); font-weight: 500; }
.stamp { font-family: var(--f-hand); font-size: 2.4rem; color: var(--red); transform: rotate(-4deg); line-height: 1; }
.plan { display: grid; gap: 6px; padding-left: 0; list-style: none; margin: 0; }
.plan li { display: flex; gap: 10px; align-items: baseline; }
.plan li span { font-family: var(--f-code); color: var(--muted); font-size: .85rem; min-width: 2.2em; }

#toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(20px); max-width: 520px; background: var(--red); color: #fff; font-weight: 700; padding: 12px 16px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
#toast.show { opacity: 1; transform: none; }
#guard { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); }
.guardcard { background: var(--card); border: 2px solid var(--red); border-radius: 16px; padding: 22px; max-width: 440px; display: grid; gap: 14px; justify-items: start; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.whoami { display: flex; gap: 12px; align-items: center; justify-content: flex-end; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
.login { max-width: 420px; }
.logintitle { font-size: clamp(2rem, 7vw, 3rem); color: var(--ink); font-weight: 700; }
.loginform { display: grid; gap: 8px; width: 100%; }
.loginform input { max-width: 100%; }
.sync { font-size: .85rem; font-weight: 700; }
.sync.ok { color: var(--green); }
.sync.saving { color: var(--muted); }
.sync.fail { color: var(--red); }
.whoami { flex-wrap: wrap; }
/* ---------- змійка ---------- */
.snake { display: block; width: 100%; max-width: 190px; height: auto; overflow: visible; }
.snake.big { max-width: 280px; }
.snake .ghost { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 3; }
.snake .segidx { font-family: var(--f-code); font-size: 9px; font-weight: 600; text-anchor: middle; fill: rgba(0,0,0,.45); }
.snake .fall { animation: fall .9s ease-in forwards; transform-box: fill-box; transform-origin: center; }
@keyframes fall { 30% { transform: translate(-2px, -6px) rotate(-10deg); } to { transform: translate(-8px, 40px) rotate(-50deg); opacity: 0; } }
.snake .poptxt { font-family: var(--f-code); font-size: 10px; font-weight: 600; fill: var(--red); animation: rise 1.6s ease-out forwards; }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; transform: none; } 70% { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }
.snake .flame { animation: flick .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
@keyframes flick { to { transform: scaleX(1.35); } }
.snake .prop { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.snake.hop .head { animation: hop .55s ease; transform-box: fill-box; transform-origin: bottom; }
@keyframes hop { 35% { transform: translateY(-7px) rotate(-6deg); } 70% { transform: translateY(1px); } }
.snakebar { min-height: 44px; }
.pet { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.pet .snake.big { flex: 0 1 280px; }
.petinfo { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.petname { font-family: var(--f-hand); font-size: 2rem; line-height: 1; color: var(--ink); }
.petinfo input { max-width: 240px; }
.wardrobe h3 { font-size: 1rem; font-weight: 500; margin-top: 6px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; width: 100%; }
.wtile { display: grid; gap: 4px; justify-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 8px; }
.wtile .snake { max-width: 140px; }
.wtile:not([disabled]):hover { border-color: var(--ink); }
.wtile.sel { border-color: var(--ink); background: var(--ink-soft); }
.wtile[disabled] { cursor: not-allowed; }
.wtile[disabled] .snake { filter: grayscale(1); opacity: .45; }
.wname { font-weight: 800; font-size: .92rem; }
.wlock { font-size: .78rem; color: var(--muted); }
.unlock { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .snake .fall { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.feedback, .card { animation: pop .18s ease-out; }

/* CodeMirror 5.65.16 base */

@-moz-keyframes blink {

}

}

  0% {}
  50% { background-color: transparent; }
  100% {}
}

/* Can style cursor different in overwrite (non-insert) mode */
.CodeMirror-overwrite .CodeMirror-cursor {}

.cm-tab { display: inline-block; text-decoration: inherit; }

.CodeMirror-composing { border-bottom: 2px solid; }

/* Default styles for common addons */

div.CodeMirror span.CodeMirror-matchingbracket {color: #0b0;}
div.CodeMirror span.CodeMirror-nonmatchingbracket {color: #a22;}
.CodeMirror-matchingtag { background: rgba(255, 150, 0, .3); }
.CodeMirror-activeline-background {background: #e8f2ff;}

.CodeMirror {
  position: relative;
  overflow: hidden;
  background: white;
}

// ---------- Python у браузері (Skulpt) ----------
let skPromise = null;
function loadPy() {
  if (skPromise) return skPromise;
  const add = src => new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
  skPromise = add("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js")
    .then(() => add("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"))
    .catch(e => { skPromise = null; throw e; });
  return skPromise;
}
async function runPy(code, inputs) {
  await loadPy();
  let out = ""; const q = (inputs || []).slice();
  Sk.configure({
    output: s => { out += s; },
    read: x => { if (Sk.builtinFiles && Sk.builtinFiles.files[x] !== undefined) return Sk.builtinFiles.files[x]; throw new Error("Немає модуля " + x); },
    inputfun: () => { if (!q.length) throw new Error("NOINPUT"); return q.shift(); },
    inputfunTakesPrompt: true,
    execLimit: 4000,
    __future__: Sk.python3,
  });
  try {
    await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true));
    return { out, err: null };
  } catch (e) {
    return { out, err: explainErr(e) };
  }
}
function explainErr(e) {
  const raw = e && e.toString ? e.toString() : String(e);
  const tips = [
    [/NOINPUT/, "Програма викликає input() більше разів, ніж є даних у тесті."],
    [/TimeLimitError/, "Програма працює занадто довго. Можливо, цикл ніколи не закінчується."],
    [/IndentationError|unindent|expected an indented/i, "Помилка відступів. Перевір, що тіло циклу, умови чи функції зсунуте на 4 пробіли."],
    [/SyntaxError/, "Синтаксична помилка. Перевір двокрапки, дужки, лапки й відступи."],
    [/IndexError/, "Індекс за межами списку. Ти звертаєшся до елемента, якого немає."],
    [/NameError/, "Невідоме ім'я. Змінна чи функція ще не створена або написана з помилкою."],
    [/TypeError/, "Помилка типів. Наприклад, додаєш число до рядка або передаєш у функцію не те."],
    [/ValueError/, "Неправильне значення. Наприклад, int() від тексту або remove() елемента, якого немає."],
    [/ZeroDivisionError/, "Ділення на нуль."],
    [/AttributeError/, "У цього об'єкта немає такого методу. Перевір назву, наприклад append, а не add."],
    [/KeyError/, "Немає такого ключа."],
  ];
  const tip = (tips.find(([r]) => r.test(raw)) || [null, "Під час виконання сталася помилка."])[1];
  return { tip, raw: raw.replace("ExternalError: Error: NOINPUT", "input()").replace(/^ExternalError: Error: /, "") };
}

// ---------- вихід з гри під час рівня ----------
// Епізод виходу: перехід на іншу вкладку, в інший застосунок або вихід з повноекранного режиму.
// За один епізод — мінус один сегмент. Повернутися до гри можна лише кнопкою на заслоні.
let awaySince = 0;          // коли учень пішов (0 — на місці)
let guardOpen = false;      // заслона показана, штраф уже знято
let wasFull = false;        // ми самі ввімкнули повноекранний режим
const GRACE = 1500;
const active = () => run && !run.over;
function penalize(reason) {
  if (!active() || guardOpen) return;
  run.leaves = (run.leaves || 0) + 1;
  prog.leaves = (prog.leaves || 0) + 1; save();
  lose(1);
  frame0Hearts();
  if (run.hearts <= 0) { hideGuard(); renderFail(); return; }
  showGuard(reason);
}
function goneAway() { if (active() && !guardOpen && !awaySince) awaySince = Date.now(); }
function cameBack() {
  if (!awaySince || document.hidden) return;
  const t = Date.now() - awaySince; awaySince = 0;
  if (t >= GRACE) penalize("away");
}
document.addEventListener("visibilitychange", () => document.hidden ? goneAway() : cameBack());
window.addEventListener("blur", goneAway);
window.addEventListener("focus", cameBack);
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) { wasFull = true; return; }
  if (!wasFull) return;
  wasFull = false;
  if (active()) { awaySince = 0; penalize("fullscreen"); }
});
function showGuard(reason) {
  guardOpen = true;
  let g = document.getElementById("guard");
  if (!g) { g = document.createElement("div"); g.id = "guard"; g.setAttribute("role", "alertdialog"); g.setAttribute("aria-modal", "true"); document.body.appendChild(g); }
  const what = reason === "fullscreen" ? "Ти вийшов(-ла) з повноекранного режиму." : "Ти переходив(-ла) на іншу вкладку чи в інший застосунок.";
  g.innerHTML = `<div class="guardcard">
    ${snakeSVG({ len: run.hearts, mood: "sad", cls: "big" })}
    <div class="stamp">Мінус сегмент!</div>
    <p>${what} ${esc(prog.name)} злякалась і загубила шматок хвоста. Лишилось сегментів: ${run.hearts} з ${MAX_HEARTS}.</p>
    <button class="btn" id="guard-back">Повернутися до гри</button>
  </div>`;
  g.hidden = false;
  document.getElementById("guard-back").onclick = () => { hideGuard(); goFullscreen(); };
  document.getElementById("guard-back").focus();
}
function hideGuard() { guardOpen = false; awaySince = 0; const g = document.getElementById("guard"); if (g) g.hidden = true; }
function toast(text) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "alert"); document.body.appendChild(t); }
  t.textContent = text; t.className = "show";
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.className = ""; }, 4500);
}
function goFullscreen() {
  try { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); } catch (e) {}
}
function leaveFullscreen() {
  wasFull = false;
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
}

function lose(n) { run.shown = run.hearts; run.hearts = Math.max(0, run.hearts - (n || 1)); run.mistakes += (n || 1); }
function next() {
  if (run.hearts <= 0) return renderFail();
  run.idx++; run.st = {};
  if (run.idx >= run.items.length) return renderDone();
  renderItem(); scrollTo(0, 0);
}

function renderItem() {
  const it = run.items[run.idx];
  ({ lesson: rLesson, quiz: rQuiz, output: rOutput, bug: rBug, order: rOrder, fill: rFill, code: rCode })[it.t](it);
}

function rLesson(it) {
  frame(it, `<h2>${esc(it.title)}</h2><p>${md(it.text)}</p>${it.code ? pre(it.code) : ""}`);
  setActs(`<button class="btn" id="nx">Зрозуміло, далі →</button>`, { nx: next });
}

function rQuiz(it) {
  const order = shuffle(it.options.map((_, i) => i));
  frame(it, `<div class="q">${md(it.q)}</div>${it.code ? pre(it.code) : ""}
    <div class="options">${order.map(i => `<button class="opt" data-i="${i}">${md(it.options[i])}</button>`).join("")}</div>`);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = i === it.a;
    app.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (+o.dataset.i === it.a) o.classList.add("right"); });
    if (!ok) { b.classList.add("wrong"); lose(); }
    frame0Hearts();
    feedback(ok, ok ? praise() : "Не зовсім", it.why);
    nextBtn();
  });
}
function frame0Hearts() {
  const box = $("#snake"); if (!box) return;
  const falling = Math.max(0, (run.shown ?? MAX_HEARTS) - run.hearts);
  run.shown = run.hearts;
  box.innerHTML = snakeSVG({ len: run.hearts, falling, mood: run.hearts <= 1 ? "sad" : falling ? "sad" : "happy" });
}

function attemptWrong(it, revealHtml) {
  run.st.tries = (run.st.tries || 0) + 1; lose(); frame0Hearts();
  if (run.st.tries >= 2 || run.hearts <= 0) {
    feedback(false, "Не зовсім", it.why, revealHtml);
    nextBtn(); return true;
  }
  feedback(false, "Спробуй ще раз", "");
  return false;
}

function rOutput(it) {
  const lines = it.a.split("\n").length;
  frame(it, `<div class="q">${md(it.q || "Що виведе ця програма?")}</div>${pre(it.code)}
    <label class="answer-label" for="ans">Твоя відповідь${lines > 1 ? ` (${lines} рядки, кожен з нового рядка)` : ""}:</label>
    <textarea id="ans" rows="${Math.max(2, lines + 1)}" spellcheck="false" autocomplete="off"></textarea>
    ${/[\[(']/.test(it.a) ? `<div class="status">Пиши точно так, як надрукує Python: список — у квадратних дужках, рядки всередині списку — в лапках.</div>` : ""}`);
  const loose = s => normOut(s).replace(/[\[\]()'\s]/g, "");
  const check = () => {
    const v = $("#ans").value;
    if (!v.trim()) return;
    if (normOut(v) === normOut(it.a)) {
      $("#ans").disabled = true;
      feedback(true, praise(), it.why); nextBtn();
    } else if (loose(v) === loose(it.a)) {
      const why = /\[/.test(it.a) && !/\[/.test(v)
        ? "Значення правильні, але `print` виводить список разом із квадратними дужками, наприклад `[1, 2]`. Допиши дужки й перевір ще раз."
        : "Значення правильні, але Python друкує їх трохи інакше. Перевір дужки та лапки: рядки всередині списку виводяться в лапках, наприклад `['а', 'б']`.";
      feedback(false, "Майже!", why);
    } else if (attemptWrong(it, `<p>Правильна відповідь:</p><pre class="code">${esc(it.a)}</pre>`)) $("#ans").disabled = true;
  };
  setActs(`<button class="btn" id="ck">Перевірити</button>`, { ck: check });
  $("#ans").focus({ preventScroll: true });
}

function rBug(it) {
  const lines = it.code.split("\n");
  frame(it, `<div class="q">${md(it.q)}</div>
    <div class="buglines">${lines.map((l, i) => `<button class="bugline" data-i="${i}"><span class="ln">${i + 1}</span><span>${hl(l) || " "}</span></button>`).join("")}</div>`);
  app.querySelectorAll(".bugline").forEach(b => b.onclick = () => {
    const ok = +b.dataset.i === it.a;
    app.querySelectorAll(".bugline").forEach(o => { o.disabled = true; if (+o.dataset.i === it.a) o.classList.add("right"); });
    if (!ok) { b.classList.add("wrong"); lose(); frame0Hearts(); }
    feedback(ok, ok ? praise() : "Не зовсім", it.why); nextBtn();
  });
}

function rOrder(it) {
  const correct = it.code.split("\n");
  let pool = shuffle(correct.map((_, i) => i));
  if (pool.every((v, i) => v === i) && pool.length > 1) pool.push(pool.shift());
  let ans = [];
  frame(it, `<div class="q">${md(it.q)}</div>
    <div class="answer-label">Натискай рядки по черзі, щоб скласти програму. Натисни на рядок у програмі, щоб повернути його назад.</div>
    <div class="zone target" id="tz"></div>
    <div class="answer-label">Рядки:</div>
    <div class="zone" id="pz"></div>`);
  let locked = false;
  const draw = () => {
    $("#tz").innerHTML = ans.length ? ans.map((k, p) => `<button class="piece" data-p="${p}">${hl(correct[k])}</button>`).join("") : `<div class="empty">Тут з'явиться твоя програма</div>`;
    $("#pz").innerHTML = pool.length ? pool.map((k, p) => `<button class="piece" data-q="${p}">${hl(correct[k])}</button>`).join("") : `<div class="empty">Усі рядки використано</div>`;
    if (locked) { app.querySelectorAll(".piece").forEach(b => b.disabled = true); return; }
    app.querySelectorAll("#tz .piece").forEach(b => b.onclick = () => { pool.push(ans.splice(+b.dataset.p, 1)[0]); draw(); });
    app.querySelectorAll("#pz .piece").forEach(b => b.onclick = () => { ans.push(pool.splice(+b.dataset.q, 1)[0]); draw(); });
    $("#ck").disabled = pool.length > 0;
  };
  const reveal = `<p>Правильна програма:</p>${pre(it.code)}`;
  const check = async () => {
    const exact = ans.every((v, i) => v === i);
    let ok = exact, note = "";
    if (!exact && it.out) {
      setActs(`<span class="status">Запускаю програму…</span>`);
      try {
        const r = await runPy(ans.map(k => correct[k]).join("\n"), []);
        ok = !r.err && normOut(r.out) === normOut(it.out);
        note = r.err ? `<p>Програма видала помилку: ${esc(r.err.tip)}</p>` : `<p>Твоя програма вивела:</p><pre class="code">${esc(r.out.trim() || "(нічого)")}</pre>`;
      } catch (e) { ok = false; }
      setActs(`<button class="btn" id="ck">Перевірити</button>`, { ck: check });
    }
    if (ok) { locked = true; draw(); feedback(true, praise(), it.why); nextBtn(); return; }
    run.st.tries = (run.st.tries || 0) + 1; lose(); frame0Hearts();
    if (run.st.tries >= 2 || run.hearts <= 0) { locked = true; draw(); feedback(false, "Не зовсім", it.why, note + reveal); nextBtn(); }
    else feedback(false, "Спробуй ще раз", "Порядок неправильний. Переставляй рядки й перевір знову.", note);
  };
  setActs(`<button class="btn" id="ck">Перевірити</button>`, { ck: check });
  draw();
}

function rFill(it) {
  const parts = it.code.split("___");
  let html = "";
  parts.forEach((p, i) => {
    html += hl(p);
    if (i < parts.length - 1) {
      const w = Math.max(3, ...it.a[i].map(s => s.length)) + 1;
      html += `<input type="text" id="b${i}" data-i="${i}" style="width:${w + 2}ch" spellcheck="false" autocomplete="off" aria-label="Пропуск ${i + 1}">`;
    }
  });
  frame(it, `<div class="q">${md(it.q)}</div><pre class="code fillcode">${html}</pre>`);
  const ins = [...app.querySelectorAll(".fillcode input")];
  const check = () => {
    if (ins.some(x => !x.value.trim())) return;
    let all = true;
    ins.forEach((x, i) => { const ok = it.a[i].some(a => normFill(a) === normFill(x.value)); x.classList.toggle("right", ok); x.classList.toggle("wrong", !ok); all = all && ok; });
    if (all) { ins.forEach(x => x.disabled = true); feedback(true, praise(), it.why); nextBtn(); return; }
    let filled = it.code; it.a.forEach(a => { filled = filled.replace("___", a[0]); });
    if (attemptWrong(it, `<p>Правильно так:</p>${pre(filled)}`)) ins.forEach(x => x.disabled = true);
  };
  ins.forEach(x => x.addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  setActs(`<button class="btn" id="ck">Перевірити</button>`, { ck: check });
  if (ins[0]) ins[0].focus({ preventScroll: true });
}

// --- задача з кодом ---
function editorKeys(ta) {
  ta.addEventListener("keydown", e => {
    const s = ta.selectionStart, v = ta.value;
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText("    ", s, ta.selectionEnd, "end"); }
    else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const lineStart = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(lineStart, s);
      let ind = (line.match(/^\s*/) || [""])[0];
      if (/:\s*$/.test(line)) ind += "    ";
      ta.setRangeText("\n" + ind, s, ta.selectionEnd, "end");
    } else if (e.key === "Backspace" && s === ta.selectionEnd) {
      const lineStart = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(lineStart, s);
      if (before.length >= 4 && /^ +$/.test(before)) { e.preventDefault(); const n = before.length % 4 || 4; ta.setRangeText("", s - n, s, "end"); }
    }
  });
}
function rCode(it) {
  if (run.st.code === undefined) run.st.code = it.starter || "";
  frame(it, `<div class="q">${md(it.q)}</div>
    <label class="answer-label" for="ed">Твій код:</label>
    <textarea id="ed" class="editor" rows="10" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
    <div id="hintbox"></div>
    <div class="tests" id="tests"></div>`);
  const ed = $("#ed"); ed.value = run.st.code;
  let cm = null;
  if (window.CodeMirror) {
    cm = CodeMirror.fromTextArea(ed, {
      mode: "python", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false, smartIndent: true,
      viewportMargin: Infinity, inputStyle: "textarea", spellcheck: false, autocorrect: false,
      extraKeys: { Tab: c => c.somethingSelected() ? c.execCommand("indentMore") : c.execCommand("insertSoftTab"), "Shift-Tab": "indentLess" },
    });
    cm.on("change", () => { run.st.code = cm.getValue(); });
    cm.focus(); cm.setCursor(cm.lineCount(), 0);
  } else {
    editorKeys(ed);
    ed.addEventListener("input", () => { run.st.code = ed.value; });
    ed.focus({ preventScroll: true }); ed.setSelectionRange(ed.value.length, ed.value.length);
  }
  const getSrc = () => cm ? cm.getValue() : ed.value;
  const lockEd = () => { if (cm) cm.setOption("readOnly", "nocursor"); else ed.disabled = true; };
  run.st.fails = run.st.fails || 0;
  const acts = () => {
    setActs(`<button class="link" id="hn">Підказка</button>${run.st.fails >= 2 ? `<button class="link" id="sol">Показати розв'язок (−2 сегменти)</button>` : ""}<span class="spacer"></span><button class="btn" id="ck">Перевірити</button>`, {
      hn: () => { $("#hintbox").innerHTML = `<div class="hint">${md(it.hint)}</div>`; },
      sol: () => { lose(2); frame0Hearts(); lockEd(); const f = achieve("peek"); feedback(false, "Розв'язок", "Розбери його і спробуй написати сам наступного разу." + (f.length ? " А ще в гардеробі тепер є каструля на голову. Для підглядачів." : ""), pre(it.solution)); nextBtn(); },
      ck: check,
    });
  };
  const check = async () => {
    const src = getSrc();
    if (it.forbid && it.forbid.some(f => src.includes(f))) {
      $("#tests").innerHTML = `<div class="test fail"><div class="head">Заборонено</div>У цій задачі не можна використовувати ${it.forbid.map(f => `<code>${esc(f)}</code>`).join(", ")}. Напиши алгоритм сам.</div>`;
      return;
    }
    setActs(`<span class="status">Перевіряю…</span>`);
    let results = [];
    try {
      for (const t of it.tests) {
        if (t.call) {
          const r = await runPy(src + "\n__r = repr(" + t.call + ")\nprint('@@R@@' + __r)\n", []);
          const [printed, got] = r.out.split("@@R@@");
          const ok = !r.err && got !== undefined && got.trim() === t.expect;
          results.push({ ok, label: t.label || t.call, expect: t.expect, got: got !== undefined ? got.trim() : null, printed: (printed || "").trim(), err: r.err, call: t.call });
        } else {
          const r = await runPy(src, t.input);
          const norm = s => s.replace(/\r/g, "").split("\n").map(l => l.replace(/\s+$/, "")).join("\n").trim();
          const ok = !r.err && norm(r.out) === norm(t.expect);
          results.push({ ok, label: "Введення: " + t.input.join(" ↵ "), expect: t.expect, got: norm(r.out), err: r.err });
        }
      }
    } catch (e) {
      $("#tests").innerHTML = `<div class="test fail"><div class="head">Не вдалося завантажити Python</div>Перевір інтернет і натисни «Перевірити» ще раз.</div>`;
      acts(); return;
    }
    const allOk = results.every(r => r.ok);
    $("#tests").innerHTML = results.map(r => `<div class="test ${r.ok ? "ok" : "fail"}">
      <div class="head">${r.ok ? "✓" : "✗"} ${esc(r.label)}</div>
      ${r.ok ? "" : r.err ? `<div>${esc(r.err.tip)}</div><pre>${esc(r.err.raw)}</pre>` : `<div>Очікували:</div><pre>${esc(r.expect)}</pre><div>Отримали:</div><pre>${esc(r.got === null || r.got === "" ? "(нічого)" : r.got)}</pre>`}
      ${!r.ok && r.call && !r.err && r.got === "None" ? `<div>Функція нічого не повертає. Можливо, забув(-ла) <code>return</code>?</div>` : ""}
    </div>`).join("");
    if (allOk) { lockEd(); feedback(true, praise(), "Усі тести пройдено.", ""); nextBtn(); }
    else { run.st.fails++; acts(); }
  };
  acts();
}

// ---------- кінець рівня ----------
function renderDone() {
  run.over = true; hideGuard(); leaveFullscreen();
  const lv = LEVELS[run.li];
  const s = run.mistakes <= 1 ? 3 : run.mistakes <= 3 ? 2 : 1;
  const prev = prog.stars[lv.id] || 0;
  const before = openIds();
  if (s > prev) { prog.stars[lv.id] = s; }
  save(); scheduleSync(true);
  if (run.mistakes === 0) achieve("perfect");
  if (lv.id === "slices" && prog.skin === "loaf" && prog.acc === "pot") achieve("loafhat");
  const fresh = [...SKINS, ...ACCS].filter(x => isOpen(x) && !before.includes(x.id));
  const hasNext = run.li + 1 < LEVELS.length;
  const msg = s === 3 ? "Відмінно!" : s === 2 ? "Добре!" : "Пройдено!";
  app.innerHTML = `<div class="center">
    <div class="stamp">${msg}</div>
    <h2>${esc(lv.title)}</h2>
    ${snakeSVG({ len: run.hearts, mood: s === 3 ? "wow" : "happy", cls: "big" })}
    ${starStr(s, "bigstars")}
    ${fresh.length ? `<div class="unlock">Відкрито в гардеробі: ${fresh.map(x => `<b>${esc(x.name)}</b>`).join(", ")}</div>` : ""}
    <p>Помилок: ${run.mistakes}. ${s < 3 ? "Три зірки дають, якщо помилок не більше однієї." : run.mistakes === 0 ? "Чистий рівень!" : "Майже ідеально!"}${s > prev && prev ? " Новий рекорд!" : ""}${run.leaves ? ` Виходів з гри: ${run.leaves}.` : ""}</p>
    <div class="syncbox">${syncLabel()}</div>
    <div class="row">${hasNext ? `<button class="btn" id="nx">Наступний рівень →</button>` : ""}<button class="btn ghost" id="map">На карту</button><button class="link" id="again">Пройти ще раз</button>${fresh.length ? `<button class="link" id="ward">Приміряти</button>` : ""}</div>
  </div>`;
  const li = run.li;
  if (fresh.length) $("#ward").onclick = renderWardrobe;
  if (hasNext) $("#nx").onclick = () => renderIntro(li + 1);
  $("#map").onclick = renderMap;
  $("#again").onclick = () => startLevel(li);
  scrollTo(0, 0);
}
function renderFail() {
  run.over = true; hideGuard(); leaveFullscreen();
  const li = run.li;
  const fresh = [...achieve("fail"), ...(run.idx >= run.items.length - 1 ? achieve("lastdeath") : [])];
  app.innerHTML = `<div class="center">
    <div class="stamp">${esc(prog.name)} лишилась без хвоста</div>
    ${snakeSVG({ len: 0, mood: "sad", cls: "big" })}
    <h2>${esc(LEVELS[li].title)}</h2>
    <p>Нічого страшного. Перечитай пояснення до задач, де були помилки, і спробуй ще раз — задачі ті самі, відповіді в питаннях перемішаються, а хвіст відросте.</p>
    ${fresh.length ? `<div class="unlock">${fresh.length > 1 ? "Утішні призи" : "Утішний приз"} у гардеробі: ${fresh.map(x => `<b>${esc(x.name)}</b>`).join(", ")}</div>` : ""}
    <div class="row"><button class="btn" id="again">Почати рівень заново</button><button class="btn ghost" id="map">На карту</button>${fresh.length ? `<button class="link" id="ward">Приміряти</button>` : ""}</div>
  </div>`;
  if (fresh.length) $("#ward").onclick = renderWardrobe;
  $("#again").onclick = () => startLevel(li);
  $("#map").onclick = renderMap;
  scrollTo(0, 0);
}

window.__game = { runPy, LEVELS, startLevel, goto: (li, k) => { startLevel(li); run.idx = k; run.st = {}; renderItem(); } };
boot();
})();

</script>
